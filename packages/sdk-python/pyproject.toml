[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secretforge"
version = "0.1.0"
description = "SecretForge Python SDK — load vault secrets into os.environ at boot; no more .env files."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "G-Tools-Spaces" }]
keywords = ["secrets", "env", "dotenv", "vault", "secretforge"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/G-Tools-Spaces/SecretForge"
Documentation = "https://github.com/G-Tools-Spaces/SecretForge/blob/main/GUIDELINES.md"

[tool.setuptools.packages.find]
where = ["src"]
