# SecretForge local development / small-team self-host stack.
#
#   docker compose up -d postgres     # just the database (for local dev)
#   docker compose up -d              # database + API
#   docker compose --profile tls up -d  # + Caddy HTTPS reverse proxy (set your domain in deploy/Caddyfile)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: secretforge
      POSTGRES_PASSWORD: secretforge
      POSTGRES_DB: secretforge
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U secretforge']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the compose network the DB host is `postgres`, not localhost.
      DATABASE_URL: postgresql://secretforge:secretforge@postgres:5432/secretforge
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ['tls']
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
